:root{--bg:#0B0A12;--panel:#15131F;--line:#262236;--ink:#EDEAF5;--mut:#9C96AE;--violet:#8E73FF;--lemon:#FFD43B;--mint:#1FC7A6;--coral:#FF5C5C;--fs:28px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"InterV",-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;font:700 15px "JBM",ui-monospace,monospace;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:#1E1B2B;color:var(--mut);text-transform:uppercase}
.pill i{width:12px;height:12px;border-radius:50%;background:#666}
.pill.live{color:#C8FFF2}.pill.live i{background:var(--mint);box-shadow:0 0 0 0 rgba(31,199,166,.7);animation:pulse 1.6s infinite}
.pill.manual{color:#FFE69A}.pill.manual i{background:var(--lemon)}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(31,199,166,0)}}
.pos{font:700 20px "JBM",ui-monospace,monospace;color:#fff}
.pos small{color:var(--mut);font-weight:500;margin-left:8px}
.sp{flex:1}
.metric{text-align:right;font:500 12px "JBM",monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.metric b{display:block;font:800 34px "JBM",ui-monospace,monospace;color:#fff;letter-spacing:0}
#elapsed{cursor:pointer}
.pace{font:700 15px "JBM",monospace;padding:6px 12px;border-radius:10px;background:#1E1B2B}
.pace.ok{color:var(--mint)}.pace.behind{color:var(--coral)}.pace.ahead{color:var(--lemon)}
.titlebar{padding:18px 26px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
#title{font:800 34px "Bricolage",system-ui,sans-serif;letter-spacing:-.01em;color:#fff}
#plan{font:600 16px "JBM",monospace;color:var(--violet)}
#notes{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 26px 26px;font-size:var(--fs);line-height:1.5}
#notes p{margin:0 0 .7em}#notes ul,#notes ol{margin:0 0 .7em 1.3em}#notes li{margin-bottom:.35em}
#notes b{color:var(--lemon)}#notes i{color:#CFC8FF}
#notes .srcs{font-size:13px;color:#6F6985;border-top:1px solid var(--line);padding-top:8px;margin-top:10px;word-break:break-all;line-height:1.4}
.next{padding:12px 26px;border-top:1px solid var(--line);font:600 20px "InterV",system-ui;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{color:#fff}
.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;padding:12px 16px 16px}
.btns button{border:none;border-radius:22px;font:800 30px "Bricolage",system-ui,sans-serif;color:#fff;padding:26px 10px;cursor:pointer;touch-action:manipulation}
#back{background:#2A2540}#fwd{background:linear-gradient(135deg,#6D4AFF,#B14DFF)}
.btns button:active{transform:scale(.98);filter:brightness(1.2)}
.tools{display:flex;gap:10px;align-items:center;padding:0 16px 14px;flex-wrap:wrap}
.tools button,.tools label{font:600 14px "JBM",monospace;background:#1E1B2B;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.tools label input{margin-right:8px;transform:scale(1.3);vertical-align:middle}
.tools .on{color:var(--mint);border-color:var(--mint)}
#roombox{position:fixed;inset:0;background:rgba(5,4,10,.94);display:none;align-items:center;justify-content:center;z-index:10}
#roombox.show{display:flex}
#roombox div{background:var(--panel);padding:30px;border-radius:20px;max-width:480px;width:90%}
#roombox input{width:100%;font:600 22px "JBM",monospace;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0B0A12;color:#fff;margin:16px 0}
#roombox button{font:800 20px system-ui;padding:14px 22px;border-radius:12px;border:none;background:var(--violet);color:#fff}
#flash{position:fixed;inset:0;pointer-events:none;background:rgba(142,115,255,.12);opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:none}
@media (max-width:700px){:root{--fs:22px}.metric b{font-size:26px}#title{font-size:26px}}
</style>
</head>
<body>
<div class="top">
  <span class="pill" id="pill"><i></i><span id="pilltxt">connecting</span></span>
  <span class="pos" id="pos">– / –</span>
  <span class="pace" id="pace">–</span>
  <span class="sp"></span>
  <div class="metric">elapsed<b id="elapsed" title="tap to reset">00:00</b></div>
  <div class="metric">clock<b id="clock">--:--</b></div>
</div>
<div class="titlebar"><span id="title">–</span><span id="plan"></span></div>
<div id="notes"></div>
<div class="next">NEXT ▸ <b id="next">–</b></div>
<div>
  <div class="btns"><button id="back">◀ BACK</button><button id="fwd">NEXT ▶</button></div>
  <div class="tools">
    <label id="drivel"><input type="checkbox" id="drive">Buttons also drive the Mac deck</label>
    <button id="aminus">A−</button><button id="aplus">A+</button>
    <button id="wake">screen: …</button>
    <button id="roomb">room</button>
  </div>
</div>
<div id="roombox"><div><b>Room code</b><p style="color:#9C96AE;margin-top:8px;font-size:15px">Same code as the deck on the Mac.</p><input id="roomin" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="roomok">Connect</button></div></div>
<div id="flash"></div>

<script>
window.SYNC_CONFIG = {"URL": "https://oynrkdtsbjgusrczmhly.supabase.co", "KEY": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bnJrZHRzYmpndXNyY3ptaGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODUxMTcsImV4cCI6MjEwODE2MTExN30.0RHx0vrTuzLu_56k5HoeRaPf88xE4neXetKBylO0hOo", "ROOM": ""};
var SLIDES = [{"title": "Title: AI and Our Future", "time": "12:15", "min": "2", "steps": 0, "notes": "<p><b>12:15 \u00b7 2 min.<\/b> On screen while people settle.<\/p>\n    <p><b>Say:<\/b> Good afternoon everyone. Today\u2019s topic is <b>\u201cAI and our Future: Models, Agents and their Coordination.\u201d<\/b><\/p>\n    <p><b>Thank the coordinator:<\/b> \u201cBefore I begin, a big thank you to <b>Diwan Singh sir<\/b>, our seminar coordinator, for organising this and giving me the chance to be here.\u201d (Keep it to one or two lines.)<\/p>\n    <p>Keys: \u2192 / PageDown = next \u00b7 \u2190 / PageUp = back \u00b7 <b>N<\/b> notes \u00b7 <b>F<\/b> fullscreen \u00b7 <b>B<\/b> black \u00b7 <b>?<\/b> help.<\/p>"}, {"title": "Who am I?", "time": "12:17", "min": "4", "steps": 0, "notes": "<p><b>12:17 \u00b7 4 min.<\/b><\/p>\n    <p><b>Your words:<\/b> \u201cI have been very close to the frontier of the AI, and I have seen the development in AI up front and very closely. Currently I am doing two internships: one is for a Delhi based startup developing a FinTech product called <b>SIFRA<\/b>, and the other is for a US based company called <b>Mercor<\/b>, for training AI models.\u201d<\/p>"}, {"title": "Why am I here?", "time": "12:21", "min": "3", "steps": 1, "notes": "<p><b>12:21 \u00b7 3 min.<\/b> <b>Click once<\/b> for the paywall card.<\/p>\n    <p><b>Your words:<\/b> \u201cAfter being so close to the frontier, one thing that I have noticed is that AI is capable of a lot of things, but most people just hear about it and don\u2019t truly understand the true potential of AI and the technologies around it.\u201d<\/p>\n    <p>(click) \u201cOne reason for it is that the frontier tech is often locked behind a paywall, which affects the accessibility.\u201d<\/p>"}, {"title": "My objective", "time": "12:24", "min": "2", "steps": 0, "notes": "<p><b>12:24 \u00b7 2 min.<\/b><\/p>\n    <p><b>Your words:<\/b> \u201cMy objective is: whoever has come to this session leaves this room with a complete understanding of three things: 1. What is the current status of the industry. 2. What is the direction that we are heading in. 3. How can I contribute to it.\u201d<\/p>"}, {"title": "Job market: still growing, changing shape", "time": "12:26", "min": "3", "steps": 1, "notes": "<p><b>12:26 \u00b7 ~3 min<\/b> (job market is 6 min across 2 slides). <b>Click once<\/b> for the banner.<\/p>\n    <p><b>Your words:<\/b> \u201cI have a few connections in the industry and the information that I am about to give is completely grounded in the current situation of the market. These are current grounded metrics of the hiring patterns after the introduction of AI in the industry. <b>The industry is still growing, but hiring is changing its shape.<\/b>\u201d<\/p>\n    <p><b>The numbers:<\/b> nasscom says India\u2019s tech industry reaches <b>~$315B in FY26 (+6.1%)<\/b>, but direct jobs grow only <b>+2.3%<\/b> (to ~6 mn, net +135,000). In nasscom\u2019s words, talent strategy shifted <b>\u201cfrom headcount-first to capability-first\u201d<\/b>; hiring moves \u201cfrom volume to skill mix\u201d: AI fluency, problem-solving, learnability at fresher level.<\/p>\n    <p><b>Extra if time:<\/b> <b>40% of employers<\/b> now prefer demonstrable AI skills/certifications over a degree (Indeed\u2013nasscom 2026). WEF Future of Jobs 2025: <b>170M jobs created vs 92M displaced by 2030<\/b>.<\/p>\n    <div class=\"srcs\">https://nasscom.in/modules/custom/nasscom_general/docs/Nasscom-Strategic%20Review-2026-Executive%20Summary.pdf \u00b7 https://nasscom.in/knowledge-center/publications/indias-ai-talent-inflection-point-skill-gaps-competitive-advantage \u00b7 https://www.weforum.org/publications/the-future-of-jobs-report-2025/<\/div>"}, {"title": "Job market: where hiring is going", "time": "12:29", "min": "3", "steps": 1, "notes": "<p><b>12:29 \u00b7 ~3 min.<\/b> <b>Click once<\/b> for the fresher comparison.<\/p>\n    <p><b>Say:<\/b> Naukri JobSpeak, September 2026, year on year: <b>AI/ML hiring +20%<\/b>, while <b>IT/Software services hiring \u22124%<\/b>. Inside IT, AI/ML still grew +11%.<\/p>\n    <p>(click) For freshers like you: <b>fresher AI/ML hiring +19%<\/b> (within IT), while <b>all fresher hiring only +1%<\/b>.<\/p>\n    <p><b>Story to tell:<\/b> Infosys has ~<b>80,000<\/b> of its ~3 lakh staff on AI coding tools, and it is <i>still<\/i> hiring <b>20,000 graduates<\/b> this year, trained in AI. (CEO Salil Parekh, 14\u201315 Oct 2026.) So the jobs are not disappearing; the <i>shape<\/i> is changing.<\/p>\n    <p><b>Fresh stat check:<\/b> Infosys results drop the morning of 23 Oct; glance at the headline before the talk, it may give a fresh hiring number.<\/p>\n    <p>Note: Naukri numbers are platform hiring activity (job postings + recruiter searches), not confirmed hires.<\/p>\n    <div class=\"srcs\">https://www.naukri.com/blog/naukri-jobspeak-october-2026-white-collar-hiring-ai-ml-growth/ \u00b7 https://www.livemint.com/companies/news/infosys-says-80-000-employees-use-ai-coding-tools-why-is-it-still-hiring-20-000-graduates-11792030468356.html<\/div>"}, {"title": "Audience time", "time": "12:32", "min": "7", "steps": 0, "notes": "<p><b>12:32 \u00b7 7 min.<\/b> Take 3\u20134 hands. Questions are spoken, not on screen.<\/p>\n    <p><b>Ask:<\/b> \u201cHow do you use AI, and what all are you doing through it?\u201d<\/p>\n    <p><b>Then:<\/b> \u201cAny one moment where you thought that AI is becoming way too powerful and you felt insecure for any specific reason?\u201d<\/p>\n    <p>Repeat each answer into the mic so the hall hears it.<\/p>"}, {"title": "What is an agent really?", "time": "12:39", "min": "3", "steps": 1, "notes": "<p><b>12:39 \u00b7 ~2 min<\/b> (agent section is 6 min with the phone moment). <b>Click once<\/b> for the Agent card.<\/p>\n    <p><b>Your words:<\/b> \u201cWhat is an agent really? What makes an agent different than a chatbot?\u201d<\/p>\n    <p><b>Simple version:<\/b> a chatbot answers, and you still do the work. An agent takes a goal, plans the steps, uses tools (browser, apps, code, files), checks its own work, and comes back for your OK.<\/p>\n    <p>Next slide: \u201cLet\u2019s ask this question to an agent itself.\u201d<\/p>"}, {"title": "Ask an agent (phone to mic)", "time": "12:41", "min": "4", "steps": 0, "notes": "<p><b>12:41 \u00b7 ~4 min. PHONE-TO-MIC MOMENT.<\/b><\/p>\n    <ol>\n      <li>Pull out your phone, open the agent app (voice mode ready beforehand; volume at max; Do Not Disturb on).<\/li>\n      <li>Ask out loud: <b>\u201cWhat makes an agent different than a chatbot?\u201d<\/b><\/li>\n      <li>Hold the <b>mic right at the phone speaker<\/b> while it answers.<\/li>\n      <li>Then summarise in one line: \u201cChatbot talks. Agent acts.\u201d<\/li>\n    <\/ol>\n    <p><b>If the phone fails:<\/b> just say the answer yourself (previous slide notes).<\/p>"}, {"title": "Current situation: timeline", "time": "12:45", "min": "3", "steps": 1, "notes": "<p><b>12:45 \u00b7 ~3 min<\/b> (industry section is 8 min, 4 slides). <b>Click once<\/b> for the \u201cagents you can use today\u201d strip.<\/p>\n    <p><b>Your words:<\/b> \u201cWhat exactly is the current situation of the industry? A timeline for recent development in the industry around AI: latest models, agents and technologies around it.\u201d<\/p>\n    <ul>\n      <li>Sep 2026 \u00b7 Anthropic: Claude Fable 5.1 &amp; Mythos 5.1.<\/li>\n      <li>Sep 21 \u00b7 Grok 4.7 (xAI, now SpaceXSI). Sep 22 \u00b7 Claude Opus 5.5.<\/li>\n      <li>Sep 29 \u00b7 OpenAI DevDay: GPT-6.1 Sol, and <b>dots<\/b>, always-on agents powered by GPT-6 Astra, each with its own cloud computer, connecting to 4,000+ apps.<\/li>\n      <li>Oct 7 \u00b7 GPT-6 rolled out to everyone in ChatGPT (1.2 bn+ weekly users).<\/li>\n      <li>Oct 12 \u00b7 Meta Muse Wonder: plans long tasks and delegates to sub-agents (agents coordinating agents).<\/li>\n      <li>Oct 13 \u00b7 Google Gemini 4 Argon.<\/li>\n    <\/ul>\n    <p>(click) Coding agents students can try today: Claude Code, Codex, Google Antigravity, Cursor, GitHub Copilot.<\/p>\n    <p>Line: \u201cEight big releases from five labs in about six weeks. By the time you graduate, this slide will be ancient.\u201d<\/p>\n    <div class=\"srcs\">https://www.anthropic.com/claude-fable-and-mythos-5-1 \u00b7 https://x.ai/news/grok-4-7 \u00b7 https://www.anthropic.com/claude-opus-5-5 \u00b7 https://openai.com/index/devday-2026-recap/ \u00b7 https://openai.com/index/introducing-dots/ \u00b7 https://openai.com/index/gpt-6-for-everyone/ \u00b7 https://research.meta.ai/blog/muse-wonder \u00b7 https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/<\/div>"}, {"title": "VIDEO: Introducing dots (OpenAI)", "time": "12:48", "min": "3", "steps": 0, "notes": "<p><b>12:48 \u00b7 ~3 min (video is 2:26).<\/b><\/p>\n    <p><b>Clicker:<\/b> first \u2192 press <b>plays<\/b> the video (P or K also toggles play/pause). The next \u2192 press moves on (and stops the video).<\/p>\n    <p><b>Your words (before):<\/b> \u201cNow let me show you the intro video for GPT dots.\u201d<\/p>\n    <p>If the video file is missing, the slide shows a big play button that opens the OpenAI page (needs internet): https://openai.com/index/introducing-dots/?video=1231177365<\/p>\n    <p>Check Mac audio output \u2192 hall speakers before the talk.<\/p>"}, {"title": "What did you understand?", "time": "12:51", "min": "1", "steps": 0, "notes": "<p><b>12:51 \u00b7 ~1\u20132 min.<\/b> Take 2\u20133 answers.<\/p>\n    <p><b>Your words:<\/b> \u201cWhat did you guys understand by seeing this video?\u201d<\/p>\n    <p>Steer to: dots are agents that work <i>on your behalf<\/i>, 24/7, on their own computer, connected to your apps, and ask before anything sensitive. Not a chatbot: a colleague.<\/p>"}, {"title": "$100/month today \u2192 cheap & accessible", "time": "12:52", "min": "1", "steps": 3, "notes": "<p><b>12:52 \u00b7 ~1\u20132 min.<\/b> Click 1 \u2192 strike through the price. Click 2 \u2192 \u201cTomorrow\u201d. Click 3 \u2192 history chips.<\/p>\n    <p><b>Your words:<\/b> \u201cCurrently the base plan for ChatGPT dots starts with <b>$100 a month<\/b>, but as it is a trend in technology, with time tech becomes cheap, and accessible to people.\u201d<\/p>\n    <p>Fact: dots need ChatGPT Pro, cheapest tier Pro 100 at $100/month (also Pro 200, Pro 500, Business Premium). Not in Free, Go ($8) or Plus ($20).<\/p>\n    <p>Examples: computers, internet, smartphones, mobile data in India all went from luxury to everyday.<\/p>\n    <div class=\"srcs\">https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers \u00b7 https://chatgpt.com/pricing/<\/div>"}, {"title": "Why should I care?", "time": "12:53", "min": "5", "steps": 3, "notes": "<p><b>12:53 \u00b7 5 min.<\/b> Clicks reveal each line, then the web line.<\/p>\n    <p><b>Your words:<\/b> \u201cIt will drastically affect how you make money. (click) It determines what will be your role in the future. (click) It opens up a lot of opportunities for us. (click) An example of this is when the web was introduced for the first time, new companies sprouted and utilised the opportunities, and some examples of such companies are Facebook, Amazon, etc.\u201d<\/p>"}, {"title": "DEMO 1: MIS timetable + Blinkit", "time": "12:58", "min": "6", "steps": 0, "notes": "<p><b>12:58 \u00b7 6 min. DEMO 1 (non-tech).<\/b> Runs on <b>Hark Pro<\/b>. Leave this slide up while you switch windows.<\/p>\n    <p><b>Prompt (your words):<\/b> \u201cGo to MIS (my college\u2019s platform https://bssserp.com/login/mis) and show me today\u2019s timetable, and while you are at it, also order a chocolate from Blinkit.\u201d<\/p>\n    <p>It <b>stops at checkout<\/b>. Joke: \u201cHe doesn\u2019t trust me with his card.\u201d / \u201cI wish I had one.\u201d<\/p>\n    <p>Close: \u201cThis kind of demo is good for people from courses other than BCA, the non-tech people. But now let\u2019s have a technical demo, specially for our BCA people here.\u201d<\/p>\n    <p><b>Rules:<\/b> never complete a payment; don\u2019t show passwords on the projector.<\/p>"}, {"title": "DEMO 2: build Ask Bhupendra live", "time": "13:04", "min": "3", "steps": 0, "notes": "<p><b>13:04 \u00b7 DEMO 2 (Stagehand, technical).<\/b> Switch to the chat Space (swipe / Ctrl+\u2192). The prompt is pre-written: just press Enter.<\/p>\n    <p><b>Prompt:<\/b> \u201cBuild me a quick website on GitHub where my audience can interact with me by posting their doubts and explore my social accounts.\u201d<\/p>\n    <p>Publishing takes <b>~40 s<\/b>: fill with banter, show the commit/code. When it\u2019s live, come back and press \u2192 for the QR.<\/p>\n    <p><b>Backup:<\/b> if Pages hasn\u2019t built in ~2 min, the backup QR (small, bottom-right on next slide) points at the pre-deployed backup site (same backend).<\/p>"}, {"title": "QR: Ask Bhupendra (post your doubts)", "time": "13:07", "min": "7", "steps": 0, "notes": "<p><b>~13:07 \u00b7 until 13:14.<\/b> Students scan, post doubts with their name. You moderate and read the best ones aloud.<\/p>\n    <p>URL to read out: <b>bhupendrasharma-eng.github.io/ask-bhupendra<\/b><\/p>\n    <p>If the live site isn\u2019t up: point to the <b>backup QR<\/b> (bottom-right) \u2192 bhupendrasharma-eng.github.io/ask-bhupendra-backup (same backend, posts still flow).<\/p>\n    <p>Moderator tab stays on the laptop, never on the projector.<\/p>"}, {"title": "Can AI replace a Human?", "time": "13:14", "min": "5", "steps": 0, "notes": "<p><b>13:14 \u00b7 5 min.<\/b> Headline only; ask the question out loud.<\/p>\n    <p><b>Your words:<\/b> \u201cThis is a question which often crosses my mind and I am sure must cross your mind too. Is it true that whatever we learn will become obsolete and will not be valued?\u201d<\/p>\n    <p><b>Audience interaction:<\/b> \u201cWhat are your views?\u201d Take 2\u20133 answers.<\/p>"}, {"title": "NO. Not anytime soon.", "time": "13:19", "min": "2", "steps": 0, "notes": "<p><b>13:19 \u00b7 ~2 min<\/b> (this section is 8 min across 3 slides).<\/p>\n    <p><b>Your words:<\/b> \u201cAI is very good in following orders, it can never replace a human itself. It may execute a narrow task faster than a human would, but \u2018replacing\u2019 a human is an entirely different ball game.\u201d<\/p>"}, {"title": "Tasks vs ownership \u00b7 lived vs token context", "time": "13:21", "min": "3", "steps": 1, "notes": "<p><b>13:21 \u00b7 ~3 min.<\/b> <b>Click once<\/b> for the second pair.<\/p>\n    <p><b>Tasks vs ownership:<\/b> AI executes isolated tasks; humans own the architectural, ethical and real-world outcomes. When something breaks in production, someone has to own it, and that is a human.<\/p>\n    <p>(click) <b>Lived context vs token context:<\/b> AI processes tokens; humans navigate reality: the unwritten constraints, the team dynamics, the hardware limits, the budget, the client who changes their mind. None of that is in the prompt unless <i>you<\/i> put it there.<\/p>"}, {"title": "Context is the father of decisions \u00b7 Optimization Paradox", "time": "13:24", "min": "3", "steps": 1, "notes": "<p><b>13:24 \u00b7 ~3 min + off-deck phone demo.<\/b> <b>Click once<\/b> for the Optimization Paradox.<\/p>\n    <p><b>Your words:<\/b> \u201cOne thing that I have learnt over the span of my experience is that <b>\u2018Context is the father of decisions.\u2019<\/b>\u201d<\/p>\n    <p>(click) \u201c<b>Optimization Paradox of AI:<\/b> An LLM will give you the mathematically or statistically \u2018optimal\u2019 answer for the prompt you wrote, which is rarely the optimal answer for the actual problem you have. The problem with the approach that AI will give us the \u2018best\u2019 answer which we want is that the \u2018best\u2019 word is highly subjective and depends on the constraints that the user has. But until the user understands how that problem is to be countered or approached from a systems design perspective, the person will not be able to supply the LLM with the complete set of constraints to make a proper decision.\u201d<\/p>\n    <p>\u201cAnyone can ask an AI for the \u2018best\u2019 way to write a program, and it will happily give you a textbook-perfect answer. But \u2018optimal\u2019 is meaningless without constraints. What\u2019s optimal for a billion-dollar cloud company will crash a local server in five minutes.\u201d<\/p>\n    <p><b>OFF-DECK PHONE DEMO (not on slides):<\/b> ask \u201cbest phone under \u20b920,000\u201d. Then re-ask with <b>ranked<\/b> priorities: battery, performance, camera, display, stereo speakers. The answer flips \u2192 \u201coptimal\u201d means nothing without constraints.<\/p>\n    <p>\u201cAnd here is why what we learn in college will never be obsolete: to give the AI the right constraints, you have to understand the fundamentals of the problem first. You can\u2019t tell an AI to optimize for memory or security if you don\u2019t know how memory or security works. AI has made getting answers cheap, which means knowing how to frame the right question is now the most valuable skill in the room.\u201d<\/p>"}, {"title": "ONE MORE THING: 80% \u2192 100%", "time": "13:27", "min": "3", "steps": 1, "notes": "<p><b>13:27 \u00b7 ~3 min.<\/b> Pause after \u201cOne more thing\u201d. <b>Click once<\/b> for the bars.<\/p>\n    <p><b>Your words:<\/b> \u201cBefore AI, 80% of an engineer\u2019s time was spent translating a known problem into working syntax. Now, AI handles the translation in seconds, which means <b>100% of the human value has shifted to defining the problem boundary and auditing the output.<\/b>\u201d<\/p>"}, {"title": "Why master CS fundamentals", "time": "13:30", "min": "2", "steps": 3, "notes": "<p><b>13:30 \u00b7 ~2 min.<\/b> Three clicks reveal the three cards.<\/p>\n    <p><b>Your words:<\/b> \u201cIf you study computer science fundamentals today, you aren\u2019t learning them so you can beat an LLM in a typing race. You are learning them so you can look at a real-world mess, (click) extract the hidden constraints, (click) feed a razor-sharp specification to the AI, (click) and immediately spot when its \u2018optimal\u2019 solution will fail in production.\u201d<\/p>\n    <p>Tie back to the paradox: the phone demo only worked because <i>you<\/i> knew which constraints mattered.<\/p>"}, {"title": "Closing line", "time": "13:32", "min": "1", "steps": 0, "notes": "<p><b>13:32 \u00b7 1 min. FINAL CLOSING LINE<\/b> (slow, look at the room):<\/p>\n    <p>\u201cIf you want to become the master in the age of AI, then stop outsourcing your thinking to prompts and master the fundamentals so deeply that <b>while another person is asking the AI what to do, you are the one telling it what to do.<\/b> Thank you.\u201d<\/p>\n    <p>Pause for applause, then \u2192 for Q&amp;A.<\/p>"}, {"title": "Q&A + socials", "time": "13:33", "min": "10", "steps": 0, "notes": "<p><b>13:33 \u00b7 ~10 min Q&amp;A.<\/b> Read the best doubts from the site (moderator tab on the laptop), then take hands. End by ~13:43 (2-min buffer before 1:45).<\/p>\n    <p>Socials on screen: LinkedIn linkedin.com/in/bhupendra-sharma-ai \u00b7 GitHub github.com/BhupendraSharma-eng \u00b7 Instagram @__bhupendra23___<\/p>\n    <p>Final thanks to Diwan Singh sir and the college.<\/p>"}];
</script>
<script>
(function(){
"use strict";
var C = window.SYNC_CONFIG, N = SLIDES.length, $ = function(id){ return document.getElementById(id); };
var qs = new URLSearchParams(location.search);
var store = { get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
var room = qs.get('room') || C.ROOM || store.get('aof-room') || '';
if(qs.get('room')) store.set('aof-room', room);
var S = { s: parseInt(store.get('aof-s')||'0',10)||0, k: parseInt(store.get('aof-k')||'0',10)||0 };
var talkStart = parseInt(store.get('aof-start')||'0',10)||0, lastDeck = 0, live = false, ch = null;
var fs = parseInt(store.get('aof-fs')||'28',10); document.documentElement.style.setProperty('--fs', fs+'px');
function pad(n){ return (n<10?'0':'')+n; }
function fmt12(hm){ var p = hm.split(':'), h = +p[0], m = p[1]; return ((h%12)||12) + ':' + m + (h>=12?' PM':' AM'); }
function render(flash){
  if(S.s<0) S.s=0; if(S.s>=N) S.s=N-1;
  var sl = SLIDES[S.s];
  $('pos').innerHTML = (S.s+1) + ' / ' + N + (sl.steps ? '<small>step ' + S.k + '/' + sl.steps + '</small>' : '');
  $('title').textContent = sl.title;
  $('plan').textContent = sl.time ? 'planned ' + fmt12(sl.time) + ' · ' + sl.min + ' min' : '';
  if($('notes')._s !== S.s){ $('notes').innerHTML = sl.notes; $('notes').scrollTop = 0; $('notes')._s = S.s; }
  $('next').textContent = S.s < N-1 ? SLIDES[S.s+1].title : '— end —';
  store.set('aof-s', S.s); store.set('aof-k', S.k);
  pace();
  if(flash){ var f=$('flash'); f.classList.add('on'); setTimeout(function(){ f.classList.remove('on'); }, 60); }
}
function pace(){
  var sl = SLIDES[S.s], el = $('pace');
  if(!sl.time){ el.textContent=''; return; }
  var now = new Date(), p = sl.time.split(':'), plan = new Date(now); plan.setHours(+p[0], +p[1], 0, 0);
  var d = Math.round((now - plan)/60000);
  if(Math.abs(d) > 180){ el.className='pace'; el.textContent='pace: –'; return; }
  if(d > 1){ el.className='pace behind'; el.textContent = d + ' min behind'; }
  else if(d < -1){ el.className='pace ahead'; el.textContent = (-d) + ' min ahead'; }
  else { el.className='pace ok'; el.textContent = 'on time'; }
}
function setPill(){
  var p = $('pill'), fresh = live && (Date.now() - lastDeck < 12000);
  p.className = 'pill ' + (fresh ? 'live' : 'manual');
  $('pilltxt').textContent = fresh ? 'live · synced' : (live ? 'waiting for deck' : (room ? 'offline · manual' : 'no room · manual'));
}
function localNext(){ var st = SLIDES[S.s].steps; if(S.k < st) S.k++; else if(S.s < N-1){ S.s++; S.k = 0; } if(!talkStart && S.s>0) startTimer(); render(true); }
function localPrev(){ if(S.k > 0) S.k--; else if(S.s > 0){ S.s--; S.k = SLIDES[S.s].steps; } render(true); }
function startTimer(t){ talkStart = t || Date.now(); store.set('aof-start', talkStart); }
function send(a, extra){ if(!ch || !live) return false; var p = {a:a}; for(var k in extra||{}) p[k]=extra[k]; ch.send({type:'broadcast', event:'cmd', payload:p}).catch(function(){}); return true; }
function go(dir){
  wake();
  var deckFresh = live && (Date.now() - lastDeck < 12000);
  if($('drive').checked && deckFresh){ send(dir>0?'next':'prev'); return; }   // deck will echo its new state
  dir>0 ? localNext() : localPrev();
}
$('fwd').addEventListener('click', function(){ go(1); });
$('back').addEventListener('click', function(){ go(-1); });
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  if(['ArrowRight','PageDown',' '].indexOf(e.key)>=0){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].indexOf(e.key)>=0){ e.preventDefault(); go(-1); }
});
$('drive').checked = store.get('aof-drive') === '1';
$('drive').addEventListener('change', function(){ store.set('aof-drive', $('drive').checked?'1':'0'); $('drivel').classList.toggle('on', $('drive').checked); });
$('drivel').classList.toggle('on', $('drive').checked);
$('aplus').onclick = function(){ fs = Math.min(48, fs+2); document.documentElement.style.setProperty('--fs', fs+'px'); store.set('aof-fs', fs); };
$('aminus').onclick = function(){ fs = Math.max(16, fs-2); document.documentElement.style.setProperty('--fs', fs+'px'); store.set('aof-fs', fs); };
$('elapsed').onclick = function(){ if(confirm('Reset the elapsed timer to 00:00 now?')) startTimer(); };
$('roomb').onclick = function(){ $('roomin').value = room; $('roombox').classList.add('show'); };
$('roomok').onclick = function(){ var r = $('roomin').value.trim(); if(r){ store.set('aof-room', r); var u = new URL(location.href); u.searchParams.set('room', r); location.href = u.toString(); } };
setInterval(function(){
  var d = new Date(); $('clock').textContent = pad(d.getHours()%12||12) + ':' + pad(d.getMinutes());
  if(talkStart){ var s = Math.max(0, Math.floor((Date.now()-talkStart)/1000)); $('elapsed').textContent = pad(Math.floor(s/60)) + ':' + pad(s%60); }
  setPill(); if(d.getSeconds()===0) pace();
}, 1000);
/* ---- keep the iPad awake ---- */
var lock = null;
async function wake(){
  if('wakeLock' in navigator){
    if(lock && !lock.released) return;
    try { lock = await navigator.wakeLock.request('screen'); $('wake').textContent='screen: awake ✓'; $('wake').classList.add('on');
      lock.addEventListener('release', function(){ $('wake').textContent='screen: tap to keep awake'; $('wake').classList.remove('on'); });
      return; } catch(e){}
  }
  var v = $('nosleep'); if(v && v.paused){ v.play().then(function(){ $('wake').textContent='screen: awake ✓ (video)'; $('wake').classList.add('on'); }).catch(function(){ $('wake').textContent='screen: tap to keep awake'; }); }
}
$('wake').onclick = wake;
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ wake(); if(live) send('hello'); } });
document.addEventListener('pointerdown', function once(){ wake(); }, {passive:true});
wake();
/* ---- realtime ---- */
render(false);
if(!room){ $('roombox').classList.add('show'); }
else if(window.supabase && C.URL && C.KEY){
  try {
    var client = window.supabase.createClient(C.URL, C.KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
    ch = client.channel('aof-deck:' + room, { config: { broadcast: { self: false, ack: false } } });
    ch.on('broadcast', { event: 'state' }, function(msg){
      var p = msg.payload || {}; lastDeck = Date.now();
      if(p.start && p.start !== talkStart) startTimer(p.start);
      var changed = (p.s !== S.s || p.k !== S.k);
      if(typeof p.s === 'number'){ S.s = p.s; S.k = p.k||0; if(changed) render(true); }
      window.__lastState = { s:p.s, k:p.k, at:Date.now() };
      setPill();
    });
    ch.subscribe(function(st){ live = (st === 'SUBSCRIBED'); setPill(); if(live) send('hello'); });
  } catch(e){ console.warn('sync off', e); }
}
setPill();
})();
</script>
